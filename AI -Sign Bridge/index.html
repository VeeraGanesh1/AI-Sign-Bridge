<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI SignBridge</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<div class="header">
<h1>🤟 AI SignBridge</h1>
<p>From Words to Meaning, From Meaning to Signs</p>
</div>

<div class="input-box">

<h2>🎤 Voice Input</h2>

<button class="voice-btn"
onclick="startVoice()">
🎤 Start Recording
</button>

<h3>OR</h3>

<h2>⌨️ Text Input</h2>

<textarea id="textInput"
placeholder="Type your sentence here..."></textarea>

<button class="convert-btn"
onclick="convertText()">
🚀 Convert to Sign Language
</button>

</div>

<div class="processing">

<h2>🧠 AI Processing</h2>

<div class="steps">

<div class="step">
✅ Speech to Text
</div>

<div class="step">
✅ NLP Analysis
</div>

<div class="step">
✅ Generative AI
</div>

<div class="step">
✅ ISL Generation
</div>

</div>

</div>

<div class="result-box">

<h2>📄 Output</h2>

<div id="result">

Waiting for input...

</div>

</div>

<footer>

AI SignBridge | Anveshan Project Expo 2026

</footer>

</div>

<script src="script.js"></script>

</body>
<img src="assets/sign.png" width="200">
</html>
